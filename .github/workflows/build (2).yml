name: Compila APK e sito

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # ogni lunedì: aggiorna le carte (nuove espansioni)

jobs:
  dati:
    # Scarica carte, testi italiani e immagini (indirizzi) da TCGdex e prepara i mazzi dell'avversario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto
        run: |
          # estrae qualsiasi .zip caricato (anche "progetto (1).zip")
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          # se i file sono finiti in una sottocartella, li riporta nella cartella principale
          if [ ! -f tools/build_data.py ]; then
            f=$(find . -path ./.git -prune -o -type f -path '*tools/build_data.py' -print | head -n 1)
            if [ -n "$f" ]; then d=$(dirname "$(dirname "$f")"); echo "progetto trovato in $d"; cp -r "$d"/. .; fi
          fi
          if [ ! -f tools/build_data.py ]; then
            echo "::error::Non trovo tools/build_data.py. Contenuto del repository:"; ls -la; exit 1
          fi
      - name: Cache delle risposte di TCGdex
        uses: actions/cache@v4
        with:
          path: .tcgdex-cache
          key: tcgdex-${{ github.run_id }}
          restore-keys: tcgdex-
      - name: Scarica le carte
        run: python3 tools/build_data.py --out webdata --cache .tcgdex-cache --workers 16
      - uses: actions/upload-artifact@v4
        with:
          name: dati-carte
          path: webdata

  prova:
    # Fa giocare i bot tra loro con tutti i mazzi per verificare che il motore non si blocchi
    needs: dati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto
        run: |
          # estrae qualsiasi .zip caricato (anche "progetto (1).zip")
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          # se i file sono finiti in una sottocartella, li riporta nella cartella principale
          if [ ! -f tools/build_data.py ]; then
            f=$(find . -path ./.git -prune -o -type f -path '*tools/build_data.py' -print | head -n 1)
            if [ -n "$f" ]; then d=$(dirname "$(dirname "$f")"); echo "progetto trovato in $d"; cp -r "$d"/. .; fi
          fi
          if [ ! -f tools/build_data.py ]; then
            echo "::error::Non trovo tools/build_data.py. Contenuto del repository:"; ls -la; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dati-carte
          path: webdata
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Partite di prova
        run: node tools/test_engine.mjs webdata 3

  apk:
    needs: dati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto
        run: |
          # estrae qualsiasi .zip caricato (anche "progetto (1).zip")
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          # se i file sono finiti in una sottocartella, li riporta nella cartella principale
          if [ ! -f tools/build_data.py ]; then
            f=$(find . -path ./.git -prune -o -type f -path '*tools/build_data.py' -print | head -n 1)
            if [ -n "$f" ]; then d=$(dirname "$(dirname "$f")"); echo "progetto trovato in $d"; cp -r "$d"/. .; fi
          fi
          if [ ! -f tools/build_data.py ]; then
            echo "::error::Non trovo tools/build_data.py. Contenuto del repository:"; ls -la; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dati-carte
          path: webdata
      - name: Copia la web app dentro l'APK
        run: bash tools/assemble_site.sh webdata app/src/main/assets/site ${{ github.run_number }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PKM-Tester-APK
          path: app/build/outputs/apk/release/*.apk

  web:
    # Versione per iPhone (e qualsiasi browser), pubblicata su GitHub Pages
    needs: dati
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto
        run: |
          # estrae qualsiasi .zip caricato (anche "progetto (1).zip")
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          # se i file sono finiti in una sottocartella, li riporta nella cartella principale
          if [ ! -f tools/build_data.py ]; then
            f=$(find . -path ./.git -prune -o -type f -path '*tools/build_data.py' -print | head -n 1)
            if [ -n "$f" ]; then d=$(dirname "$(dirname "$f")"); echo "progetto trovato in $d"; cp -r "$d"/. .; fi
          fi
          if [ ! -f tools/build_data.py ]; then
            echo "::error::Non trovo tools/build_data.py. Contenuto del repository:"; ls -la; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dati-carte
          path: webdata
      - name: Prepara il sito
        run: bash tools/assemble_site.sh webdata site ${{ github.run_number }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
